<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Longcross South Studios — survey comparison</title>
<style>
:root{--bg:#10161c;--panel:#182027;--line:#2b3843;--text:#e8eef4;--dim:#93a4b3;--accent:#1F6F4A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:baseline;gap:12px;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;font-weight:650;letter-spacing:.2px}
header .co{font-size:12px;color:var(--dim);margin-left:auto}
#map{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;background:#0b1014}
#map.drag{cursor:grabbing}
.layer{position:absolute;inset:0;overflow:hidden;will-change:transform}
.layer img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;
  image-rendering:auto}
#right{z-index:2}
#chg{z-index:3;pointer-events:none}
#handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:5;cursor:ew-resize;
  box-shadow:0 0 0 1px rgba(0,0,0,.45);touch-action:none}
#handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;
  transform:translate(-50%,-50%);border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
#handle::before{content:"";position:absolute;top:50%;left:50%;width:12px;height:12px;
  transform:translate(-50%,-50%) rotate(45deg);border-left:2px solid #333;
  border-bottom:2px solid #333;z-index:1;margin-left:-4px}
.tag{position:absolute;top:10px;padding:4px 9px;border-radius:4px;background:rgba(0,0,0,.62);
  font-size:12px;font-weight:600;z-index:4;pointer-events:none;backdrop-filter:blur(3px)}
#tagL{left:10px}#tagR{right:10px}
#scale{position:absolute;left:10px;bottom:10px;z-index:4;font-size:11px;color:#fff;
  text-shadow:0 1px 3px #000;pointer-events:none}
#scale div{height:5px;border:2px solid #fff;border-top:none;box-shadow:0 1px 3px rgba(0,0,0,.6)}
#zoom{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;flex-direction:column;gap:5px}
#zoom button{width:34px;height:34px;font-size:19px;line-height:1;border:1px solid var(--line);
  background:rgba(24,32,39,.92);color:var(--text);border-radius:5px;cursor:pointer}
#zoom button:active{background:var(--accent)}
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:9px 14px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
select,input[type=range]{background:#0f151a;color:var(--text);border:1px solid var(--line);
  border-radius:4px;padding:4px 6px;font:inherit;font-size:12px}
input[type=range]{padding:0;width:104px}
label.sw{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
#legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
#ramp{width:118px;height:9px;border-radius:2px;border:1px solid var(--line)}
#note{font-size:11px;color:var(--dim);padding:0 14px 9px;background:var(--panel);flex:none}
@media(max-width:640px){header h1{font-size:13px}header .co{display:none}
  footer{gap:9px;padding:8px 10px}input[type=range]{width:74px}}
</style>
<div id="app">
  <header><h1>Longcross South Studios</h1><span class="co">Parallax Aerial</span></header>
  <div id="map">
    <div class="layer" id="left"></div>
    <div class="layer" id="right"></div>
    <div class="layer" id="chg"></div>
    <div id="handle"></div>
    <div class="tag" id="tagL"></div>
    <div class="tag" id="tagR"></div>
    <div id="scale"><span></span><div></div></div>
    <div id="zoom"><button id="zin">+</button><button id="zout">&minus;</button></div>
  </div>
  <footer>
    <span class="ctl">Left <select id="selL"></select></span>
    <span class="ctl">Right <select id="selR"></select></span>
    <label class="sw"><input type="checkbox" id="swipe" checked> Swipe</label>
    <label class="sw"><input type="checkbox" id="showChg"> Change overlay</label>
    <span class="ctl" id="opWrap">Opacity <input type="range" id="op" min="0" max="100" value="70"></span>
    <span id="legend"><span id="lo"></span><span id="ramp"></span><span id="hi"></span></span>
  </footer>
  <div id="note"></div>
</div>
<script>
var CFG = {"site": "Longcross South Studios", "bounds": [-0.59261913, 51.37698963, -0.57209314, 51.38678524], "minzoom": 14, "maxzoom": 21, "ramp": ["#b2182b", "#ef8a62", "#f7f7f7", "#67a9cf", "#2166ac"], "flights": [{"task_id": "9842d0ca-1f0a-40d2-bc7d-e67a670920e9", "label": "Baseline - 16 Aug 2026", "layer": "flights/9842d0ca", "ext": "webp", "images": 963, "notes": ""}], "changes": []};

var R = 6378137, C = 2 * Math.PI * R, TS = 256;
function lonToX(l){ return (l + 180) / 360; }
function latToY(l){ var s = Math.sin(l * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); }

var map = document.getElementById('map');
var zoom, cx, cy;   // cx/cy are world coordinates in [0,1]
var minZ = CFG.minzoom, maxZ = CFG.maxzoom;

(function init(){
  var b = CFG.bounds;                    // [w,s,e,n]
  cx = (lonToX(b[0]) + lonToX(b[2])) / 2;
  cy = (latToY(b[3]) + latToY(b[1])) / 2;
  var vw = map.clientWidth || 800, vh = map.clientHeight || 600;
  var wSpan = lonToX(b[2]) - lonToX(b[0]), hSpan = latToY(b[1]) - latToY(b[3]);
  // largest zoom at which the whole site still fits the viewport
  var z = Math.floor(Math.log2(Math.min(vw / (wSpan * TS), vh / (hSpan * TS))));
  zoom = Math.max(minZ, Math.min(maxZ, z));
})();

function layerDivs(){ return {left: document.getElementById('left'),
  right: document.getElementById('right'), chg: document.getElementById('chg')}; }

function drawLayer(el, layer, ext){
  if(!layer){ el.innerHTML = ''; return; }
  var vw = map.clientWidth, vh = map.clientHeight;
  var scale = TS * Math.pow(2, zoom);
  var originX = cx * scale - vw / 2, originY = cy * scale - vh / 2;
  var x0 = Math.floor(originX / TS), x1 = Math.floor((originX + vw) / TS);
  var y0 = Math.floor(originY / TS), y1 = Math.floor((originY + vh) / TS);
  var n = Math.pow(2, zoom), seen = {}, frag = document.createDocumentFragment();
  var cache = el._c || (el._c = {});
  for(var x = x0; x <= x1; x++){
    for(var y = y0; y <= y1; y++){
      if(y < 0 || y >= n) continue;
      var tx = ((x % n) + n) % n, key = zoom + '/' + tx + '/' + y;
      seen[key] = 1;
      var img = cache[key];
      if(!img){
        img = new Image();
        img.src = layer + '/' + zoom + '/' + tx + '/' + y + '.' + ext;
        img.onerror = function(){ this.style.visibility = 'hidden'; };
        cache[key] = img; frag.appendChild(img);
      }
      img.style.left = (x * TS - originX) + 'px';
      img.style.top  = (y * TS - originY) + 'px';
    }
  }
  el.appendChild(frag);
  for(var k in cache){ if(!seen[k]){ cache[k].remove(); delete cache[k]; } }
}

function currentChange(){
  var a = document.getElementById('selL').value, b = document.getElementById('selR').value;
  for(var i = 0; i < CFG.changes.length; i++){
    var c = CFG.changes[i];
    if(c.from === a && c.to === b) return c;
    if(c.from === b && c.to === a) return c;   // same pair, viewed the other way round
  }
  return null;
}

function render(){
  var d = layerDivs();
  var L = CFG.flights[document.getElementById('selL').selectedIndex];
  var Rt = CFG.flights[document.getElementById('selR').selectedIndex];
  drawLayer(d.left, L.layer, L.ext);
  drawLayer(d.right, Rt.layer, Rt.ext);

  var wantChg = document.getElementById('showChg').checked;
  var ch = wantChg ? currentChange() : null;
  drawLayer(d.chg, ch ? ch.layer : null, ch ? ch.ext : 'webp');
  d.chg.style.opacity = document.getElementById('op').value / 100;

  document.getElementById('tagL').textContent = L.label;
  document.getElementById('tagR').textContent = Rt.label;
  var lo = document.getElementById('lo'), hi = document.getElementById('hi');
  if(ch){ lo.textContent = '-' + ch.limit + ' m'; hi.textContent = '+' + ch.limit + ' m'; }
  else { lo.textContent = ''; hi.textContent = ''; }
  document.getElementById('legend').style.visibility = ch ? 'visible' : 'hidden';

  applySwipe();
  drawScale();
}

function applySwipe(){
  var on = document.getElementById('swipe').checked;
  var h = document.getElementById('handle'), r = document.getElementById('right');
  var tagR = document.getElementById('tagR');
  h.style.display = on ? 'block' : 'none';
  tagR.style.display = on ? 'block' : 'none';
  if(!on){ r.style.clipPath = 'none'; r.style.display = 'none'; return; }
  r.style.display = 'block';
  var px = Math.max(0, Math.min(map.clientWidth, split * map.clientWidth));
  r.style.clipPath = 'inset(0 0 0 ' + px + 'px)';
  h.style.left = px + 'px';
}

function drawScale(){
  var lat = 180 / Math.PI * (2 * Math.atan(Math.exp((0.5 - cy) * 2 * Math.PI)) - Math.PI / 2);
  var mpp = C * Math.cos(lat * Math.PI / 180) / (TS * Math.pow(2, zoom));
  var target = 90 * mpp, nice = [1,2,5,10,20,25,50,100,200,250,500,1000,2000];
  var m = nice[nice.length - 1];
  for(var i = 0; i < nice.length; i++){ if(target <= nice[i]){ m = nice[i]; break; } }
  var el = document.getElementById('scale');
  el.querySelector('span').textContent = m >= 1000 ? (m/1000) + ' km' : m + ' m';
  el.querySelector('div').style.width = (m / mpp) + 'px';
}

/* ---- interaction: drag to pan, wheel/pinch to zoom, drag the swipe handle ---- */
var split = 0.5, dragging = null, last = null, handleDrag = false;

function ptr(e){ return e.touches ? e.touches[0] : e; }

map.addEventListener('pointerdown', function(e){
  if(e.target.id === 'handle'){ handleDrag = true; e.target.setPointerCapture(e.pointerId); return; }
  dragging = e.pointerId; last = {x:e.clientX, y:e.clientY};
  map.classList.add('drag'); map.setPointerCapture(e.pointerId);
});
map.addEventListener('pointermove', function(e){
  if(handleDrag){
    split = Math.max(0, Math.min(1, e.clientX / map.clientWidth));
    applySwipe(); return;
  }
  if(dragging === null) return;
  var scale = TS * Math.pow(2, zoom);
  cx -= (e.clientX - last.x) / scale;
  cy -= (e.clientY - last.y) / scale;
  last = {x:e.clientX, y:e.clientY};
  render();
});
function endDrag(){ dragging = null; handleDrag = false; map.classList.remove('drag'); }
map.addEventListener('pointerup', endDrag);
map.addEventListener('pointercancel', endDrag);

map.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY);
}, {passive:false});

function zoomBy(dz, px, py){
  var nz = Math.max(minZ, Math.min(maxZ, zoom + dz));
  if(nz === zoom) return;
  var r = map.getBoundingClientRect();
  px = (px === undefined ? r.width / 2 : px - r.left);
  py = (py === undefined ? r.height / 2 : py - r.top);
  var s0 = TS * Math.pow(2, zoom), s1 = TS * Math.pow(2, nz);
  // keep the point under the cursor fixed
  var wx = cx + (px - r.width / 2) / s0, wy = cy + (py - r.height / 2) / s0;
  zoom = nz;
  cx = wx - (px - r.width / 2) / s1;
  cy = wy - (py - r.height / 2) / s1;
  var d = layerDivs();
  d.left._c = {}; d.right._c = {}; d.chg._c = {};
  d.left.innerHTML = d.right.innerHTML = d.chg.innerHTML = '';
  render();
}
document.getElementById('zin').onclick = function(){ zoomBy(1); };
document.getElementById('zout').onclick = function(){ zoomBy(-1); };

/* pinch */
var pinch = null;
map.addEventListener('touchstart', function(e){
  if(e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive:true});
map.addEventListener('touchmove', function(e){
  if(e.touches.length === 2 && pinch){
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
    if(Math.abs(d - pinch) > 55){
      zoomBy(d > pinch ? 1 : -1,
             (e.touches[0].clientX + e.touches[1].clientX) / 2,
             (e.touches[0].clientY + e.touches[1].clientY) / 2);
      pinch = d;
    }
  }
}, {passive:true});
map.addEventListener('touchend', function(){ pinch = null; }, {passive:true});

/* ---- wire up ---- */
var selL = document.getElementById('selL'), selR = document.getElementById('selR');
CFG.flights.forEach(function(f, i){
  selL.add(new Option(f.label, f.task_id));
  selR.add(new Option(f.label, f.task_id));
});
selL.selectedIndex = 0;
selR.selectedIndex = CFG.flights.length - 1;
['change','input'].forEach(function(ev){
  [selL, selR, document.getElementById('swipe'),
   document.getElementById('showChg'), document.getElementById('op')]
    .forEach(function(el){ el.addEventListener(ev, render); });
});
document.getElementById('ramp').style.background =
  'linear-gradient(90deg,' + CFG.ramp.join(',') + ')';
window.addEventListener('resize', render);
render();
</script>
